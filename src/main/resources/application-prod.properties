# ---------- production profile (MySQL) ----------
# run with: mvn spring-boot:run -Dspring-boot.run.profiles=prod
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/quantitymeasurementdb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

logging.level.com.app.quantitymeasurement=INFO
management.endpoint.health.show-details=when-authorized
