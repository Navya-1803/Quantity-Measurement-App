spring.application.name=quantitymeasurement

# ---------- repository selection ----------
# cache    -> in memory list saved to a file
# database -> JDBC repository
repository.type=database

# ---------- database (development, H2 in-memory) ----------
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1
db.username=sa
db.password=
db.schema=db/schema.sql

# ---------- connection pool ----------
db.pool.size=5
db.pool.timeout.ms=3000

# ---------- production database (MySQL, used in later use cases) ----------
# db.url=jdbc:mysql://localhost:3306/quantitymeasurementdb
# db.driver=com.mysql.cj.jdbc.Driver

# ---------- logging ----------
logging.level.com.app.quantitymeasurement=INFO
